<!doctype html>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5f6ff'/%3E%3Cpath d='M12 51 51 12a30 30 0 0 1-39 39Z' fill='%237dd3fc'/%3E%3C/svg%3E">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172027;background:#f6f8fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#fff 0,#f6f8fa 48%,#eef2f4 100%)}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}.app{width:min(1440px,100%);margin:0 auto;padding:22px 28px 28px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:14px}.logo{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:linear-gradient(135deg,#f1fbff 0 48%,#bceaff 48% 100%);box-shadow:0 3px 12px #72c9ec24}.brand-copy h1{font-size:21px;line-height:30px;letter-spacing:-.045em;margin:0;font-weight:820}.subtitle{display:none}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;align-items:start}.canvas-column{min-width:0}.preview-frame{padding:2px;background:#fff;border:1px solid #e3e9ec;border-radius:16px;box-shadow:0 16px 45px #40535e14}.stage{position:relative;aspect-ratio:1.72;border-radius:13px;overflow:hidden;touch-action:none;cursor:grab}.stage svg{display:block;width:100%;height:100%}.stage.dragging{cursor:grabbing}.stage .edge-hit{stroke:transparent;stroke-width:46;fill:none;cursor:pointer}.stage .edge-guide{stroke:#fff;stroke-width:2;stroke-dasharray:8 9;opacity:.38;pointer-events:none}.stage .edge-guide.selected{stroke-width:4;stroke-dasharray:none;opacity:.95}.stage .edge-handle{fill:#fff;stroke:#44606d;stroke-width:2;opacity:0;pointer-events:none}.stage .edge-handle.selected{opacity:.95}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.panel{background:rgba(255,255,255,.88);border:1px solid #e1e7ea;border-radius:20px;padding:16px 18px;box-shadow:0 18px 45px #40535e12;backdrop-filter:blur(14px);position:sticky;top:18px;text-align:left}.panel-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8b959b;margin:0 0 7px}.control{padding:12px 0;border-top:1px solid #edf0f2}.control:first-of-type{border-top:0;padding-top:2px}.control-label{display:block;font-size:13px;font-weight:760;color:#334149;margin-bottom:8px}.line-picker{display:grid;grid-template-columns:1fr 1fr;gap:7px}.line-picker button{height:35px;border:1px solid #dce4e8;background:#f8fafb;color:#68747b;border-radius:10px;font-size:12px;font-weight:750}.line-picker button.selected{background:#17242b;border-color:#17242b;color:#fff}.palette-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center}.swatch,.custom{width:34px;height:34px;border-radius:50%;justify-self:center;position:relative}.swatch{border:1px solid #e3e8ea;padding:0;box-shadow:0 3px 8px #29374312;transition:transform .15s}.swatch:hover{transform:translateY(-2px)}.swatch.selected:after{content:"";position:absolute;inset:-4px;border:1.5px solid #85949b;border-radius:50%}.custom{overflow:hidden;border:1px solid #d8e1e7;background:conic-gradient(#ff6868,#ffc85d,#61df9e,#6dc8ff,#ab8dff,#ff6868);box-shadow:0 3px 8px #29374312}.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.custom.selected:after{content:"";position:absolute;inset:3px;border:2px solid #fff;border-radius:50%;pointer-events:none}.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:36px;border:1px solid #dce4e8;background:#f8fafb;color:#3d4a51;border-radius:10px;padding:0 9px;font-size:11.5px;font-weight:760}.action:hover{background:#eef5f7}.action.regrade{background:#eafaf5;border-color:#d6f1e7;color:#285f4a}.action .dot{display:inline-block;background:#55d799;border-radius:50%;width:8px;height:8px;margin-right:6px}.action.primary{width:100%;height:42px;background:#17242b;border-color:#17242b;color:#fff;font-size:13px}.action.primary:hover{background:#30424b}.export-fields{display:grid;gap:7px}.select-wrap label{display:block;font-size:11px;font-weight:750;color:#7a858b;margin-bottom:4px}.select-wrap select{width:100%;height:36px;border:1px solid #dce4e8;background:#f8fafb;border-radius:9px;padding:0 9px;color:#25323a;font-size:11.5px}.panel-hint{margin:8px 0 0;color:#899298;font-size:10.5px;line-height:1.4}@media(max-width:900px){.app{padding:24px 20px 34px}.workspace{grid-template-columns:1fr}.panel{position:static;display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.panel-title{grid-column:1/-1}.download-control{grid-column:1/-1}.canvas-note{flex-direction:column;gap:3px}.status{text-align:left}}@media(max-width:560px){.app{padding:20px 14px 30px}.brand{margin-bottom:14px}.logo{width:30px;height:30px;flex-basis:30px}.brand-copy h1{font-size:21px}.workspace{gap:14px}.preview-frame{padding:2px;border-radius:16px}.stage{border-radius:13px;aspect-ratio:1.25}.panel{grid-template-columns:1fr;padding:16px}.panel-title,.download-control{grid-column:auto}.palette-row{grid-template-columns:repeat(7,1fr)}.swatch,.custom{width:34px;height:34px}}
.depth-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px}.depth-value{min-width:35px;text-align:right;font-size:11px;font-weight:800;color:#526169}.depth-row input{width:100%;accent-color:#17242b}.style-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.style-picker button{height:31px;padding:0 4px;border:1px solid #dce4e8;background:#f8fafb;color:#68747b;border-radius:9px;font-size:10px;font-weight:750}.style-picker button.selected{background:#e9f6fb;border-color:#9edbf1;color:#1d617d}.theme-toggle{pointer-events:auto;margin-left:auto;height:30px;border:1px solid #dce4e8;border-radius:999px;background:rgba(255,255,255,.82);color:#3d4a51;padding:0 12px;font-size:11px;font-weight:760;box-shadow:0 3px 12px #3146500e}.theme-toggle:hover{background:#fff}.theme-icon{display:inline-block;margin-right:6px}.dark{color:#e7edf0;background:#10161b}.dark body{background:radial-gradient(circle at 65% 0,#26323a 0,#151d22 48%,#0d1216 100%)}.dark .panel{background:rgba(24,32,38,.94);border-color:#3a474e;box-shadow:0 24px 70px #0007}.dark .preview-frame{background:#263239;border-color:#3c4a52}.dark .panel-title,.dark .select-wrap label,.dark .panel-hint{color:#8f9ba2}.dark .control{border-color:#344048}.dark .control-label{color:#d9e1e5}.dark .line-picker button,.dark .style-picker button,.dark .action,.dark .select-wrap select,.dark .theme-toggle{background:#202a30;border-color:#3b4850;color:#cbd5da}.dark .line-picker button.selected,.dark .action.primary{background:#edf3f5;border-color:#edf3f5;color:#172027}.dark .style-picker button.selected{background:#214353;border-color:#3a718a;color:#dff6ff}.dark .theme-toggle:hover{background:#2a353b}
@media(min-width:721px){body{overflow:hidden}.app{max-width:none;height:100vh;margin:0;padding:64px 372px 20px 20px}.brand{position:fixed;z-index:20;top:20px;left:20px;right:20px;height:30px;margin:0;pointer-events:none}.workspace,.canvas-column,.preview-frame{height:calc(100vh - 84px)}.workspace{display:block}.panel{position:fixed;z-index:10;display:block;inset:64px 20px 20px auto;width:326px;height:auto;overflow-y:auto;border:1px solid #dfe6e9;border-radius:22px;padding:24px 22px 26px;background:rgba(255,255,255,.9);box-shadow:0 24px 70px #31465022,0 4px 16px #31465012;backdrop-filter:blur(18px)}.canvas-column{width:100%;max-width:none}.preview-frame{width:100%}.stage{height:100%;aspect-ratio:auto}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.panel-title:after{content:"SHARPED";font-size:9px;letter-spacing:.16em;color:#b2bbc0}}
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div class="brand-copy"><h1>Sharped</h1></div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false"><span class="theme-icon" aria-hidden="true">◐</span><span id="themeLabel">Dark</span></button>
  </header>
  <div class="workspace">
    <section class="canvas-column" aria-label="Gradient canvas">
      <div class="preview-frame"><div id="stage" class="stage" aria-label="Gradient preview. Select a line, then drag anywhere to move it."><svg id="preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="none" role="img" aria-label="Sharp-edged gradient"></svg></div></div>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </section>
    <aside class="panel" aria-label="Gradient controls">
      <p class="panel-title">Controls</p>
      <section class="control"><span class="control-label">Selected line</span><div class="line-picker" id="linePicker" role="group" aria-label="Selected gradient line"><button type="button" class="selected" data-line="0" aria-pressed="true">Line 1</button><button type="button" data-line="1" aria-pressed="false">Line 2</button></div></section>
      <section class="control"><span class="control-label">Colour</span><div class="palette-row" id="paletteRow" role="group" aria-label="Gradient colours"></div></section>
      <section class="control"><span class="control-label">Depth</span><div class="depth-row"><input id="depth" type="range" min="0" max="100" value="42" aria-label="Edge depth"><output id="depthValue" class="depth-value">42%</output></div><div class="style-picker" id="stylePicker" role="group" aria-label="Depth style"><button type="button" class="selected" data-style="prism">Prism</button><button type="button" data-style="fold">Fold</button><button type="button" data-style="fan">Fan</button><button type="button" data-style="slice">Slice</button></div></section>
      <section class="control"><span class="control-label">Shape</span><div class="button-grid"><button type="button" class="action regrade" id="regenerate"><span class="dot"></span>Regenerate</button><button type="button" class="action" id="reset">Reset edges</button></div></section>
      <section class="control"><span class="control-label">Export</span><div class="export-fields"><div class="select-wrap"><label for="size">Size</label><select id="size"><option value="social">Social landscape · 1200 × 630</option><option value="square">Social square · 1080 × 1080</option><option value="portrait">Social portrait · 1080 × 1350</option><option value="story">Story · 1080 × 1920</option><option value="substack">Substack cover · 1200 × 630</option><option value="medium">Medium wide · 1200 × 675</option><option value="wallpaper">Desktop · 1920 × 1080</option></select></div><div class="select-wrap"><label for="format">Format</label><select id="format"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option><option value="svg">SVG</option></select></div></div></section>
      <section class="control download-control"><button type="button" class="action primary" id="download">Download file ↓</button><p class="panel-hint">Exports use the selected size and file format.</p></section>
    </aside>
  </div>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id),stage=$('stage'),preview=$('preview'),status=$('status');
 const presets=[['Blue','#38bdf8'],['Purple','#a855f7'],['White','#f8fafc'],['Green','#4ade80'],['Red','#fb7185'],['Black','#111827']];
 const sizes={social:[1200,630],square:[1080,1080],portrait:[1080,1350],story:[1080,1920],substack:[1200,630],medium:[1200,675],wallpaper:[1920,1080]};
 let color=presets[0][1],chosen='Blue',edges=[{top:.24,bottom:.68},{top:.72,bottom:.18}],selectedEdge=0,drag=null,seed=1,depth=.42,depthStyle='prism';
 const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
 const savedTheme=localStorage.getItem('sharped-theme'),themeToggle=$('themeToggle'),themeLabel=$('themeLabel');
 function setTheme(dark){document.documentElement.classList.toggle('dark',dark);themeToggle.setAttribute('aria-pressed',dark?'true':'false');themeLabel.textContent=dark?'Light':'Dark';localStorage.setItem('sharped-theme',dark?'dark':'light')}
 setTheme(savedTheme==='dark'||(!savedTheme&&matchMedia('(prefers-color-scheme: dark)').matches));themeToggle.addEventListener('click',()=>setTheme(!document.documentElement.classList.contains('dark')));
 function hexRGB(hex){let s=hex.replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(s.slice(i,i+2),16))}
 function mix(a,b,t){const x=hexRGB(a),y=hexRGB(b);return '#'+x.map((v,i)=>Math.round(v*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join('')}
 function colors(){const dark=chosen==='Black',white=chosen==='White';return white?['#ffffff','#f1f5f9','#dce8ef','#fafcff','#e2e8f0']:dark?['#090e17','#1f2937','#4b5563','#111827','#64748b']:[mix(color,'#ffffff',.87),mix(color,'#ffffff',.65),mix(color,'#ffffff',.42),mix(color,'#ffffff',.77),mix(color,'#ffffff',.28)]}
 function gradientMarkup(w,h,interactive){const c=colors(),a=edges[0],b=edges[1],x=n=>Math.round(n*w),line=(e,i)=>`<line x1="${x(e.top)}" y1="0" x2="${x(e.bottom)}" y2="${h}" class="edge-guide ${i===selectedEdge?'selected':''}"/><line x1="${x(e.top)}" y1="0" x2="${x(e.bottom)}" y2="${h}" class="edge-hit" data-edge="${i}"/><circle cx="${x(e.top)}" cy="0" r="10" class="edge-handle ${i===selectedEdge?'selected':''}"/><circle cx="${x(e.bottom)}" cy="${h}" r="10" class="edge-handle ${i===selectedEdge?'selected':''}"/>`;
 const band=Math.round(w*(.012+depth*.07)),opacity=(.08+depth*.36).toFixed(2),hi=(.08+depth*.2).toFixed(2),den=(a.bottom-a.top)-(b.bottom-b.top),iy=Math.max(.12,Math.min(.88,Math.abs(den)<.01?.5:(b.top-a.top)/den)),ix=x(a.top+(a.bottom-a.top)*iy),cy=Math.round(iy*h);
 const hardBands=depth<=0?'':edges.map((e,i)=>{const side=depthStyle==='slice'?(i%2?1:-1):depthStyle==='fan'?1:(i?-1:1),t=x(e.top),bt=x(e.bottom),off=band*side;return `<polygon points="${t},0 ${t+off},0 ${bt+off},${h} ${bt},${h}" fill="url(#depthColour${i})" opacity="${opacity}"/><polygon points="${t-off*.22},0 ${t},0 ${bt},${h} ${bt-off*.22},${h}" fill="url(#depthLight)" opacity="${hi}"/>`}).join('');
 const prism=`<polygon points="0,0 ${x(a.top)},0 ${ix},${cy} 0,${Math.round(h*.46)}" fill="#fff" opacity="${(.06+depth*.16).toFixed(2)}"/><polygon points="${x(a.top)},0 ${x(b.top)},0 ${ix},${cy}" fill="${c[0]}" opacity="${(.12+depth*.2).toFixed(2)}"/><polygon points="${x(b.top)},0 ${w},0 ${w},${Math.round(h*.22)} ${ix},${cy}" fill="#fff" opacity="${(.1+depth*.22).toFixed(2)}"/><polygon points="0,${Math.round(h*.46)} ${ix},${cy} ${x(a.bottom)},${h} 0,${h}" fill="${c[1]}" opacity="${(.12+depth*.18).toFixed(2)}"/><polygon points="${ix},${cy} ${w},${Math.round(h*.22)} ${w},${h} ${x(b.bottom)},${h}" fill="#fff" opacity="${(.07+depth*.17).toFixed(2)}"/>`;
 const depthLayers=depthStyle==='prism'?prism:hardBands;
 return `<defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="${c[3]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="${c[2]}"/><stop offset="1" stop-color="${c[4]}"/></linearGradient><linearGradient id="depthColour0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[4]}"/></linearGradient><linearGradient id="depthColour1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[4]}"/></linearGradient><linearGradient id="depthLight"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="${c[0]}"/></linearGradient></defs><polygon points="0,0 ${x(a.top)},0 ${x(a.bottom)},${h} 0,${h}" fill="url(#g0)"/><polygon points="${x(a.top)},0 ${x(b.top)},0 ${x(b.bottom)},${h} ${x(a.bottom)},${h}" fill="url(#g1)"/><polygon points="${x(b.top)},0 ${w},0 ${w},${h} ${x(b.bottom)},${h}" fill="url(#g2)"/>${depthLayers}${interactive?edges.map(line).join(''):''}`;}
 function render(){preview.innerHTML=gradientMarkup(1000,600,true);document.querySelectorAll('#linePicker button').forEach((b,i)=>{const on=i===selectedEdge;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on?'true':'false')});document.querySelectorAll('#stylePicker button').forEach(b=>b.classList.toggle('selected',b.dataset.style===depthStyle))}
 function svgString(w,h){return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${gradientMarkup(w,h,false)}</svg>`}
 const paletteRow=$('paletteRow');presets.forEach(([name,hex])=>{const b=document.createElement('button');b.type='button';b.className='swatch'+(name==='Blue'?' selected':'');b.title=name;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',name==='Blue'?'true':'false');b.style.background=`linear-gradient(135deg,${mix(hex,'#fff',.68)},${mix(hex,'#fff',.2)})`;b.dataset.name=name;b.addEventListener('click',()=>select(hex,name));paletteRow.append(b)});const custom=document.createElement('label');custom.className='custom';custom.title='Custom colour';custom.setAttribute('aria-label','Custom colour');custom.innerHTML='<input id="customColor" type="color" value="#38bdf8" aria-label="Custom colour">';paletteRow.append(custom);$('customColor').addEventListener('input',e=>select(e.target.value,'Custom'));
 function select(hex,name){color=hex;chosen=name;paletteRow.querySelectorAll('.swatch').forEach(b=>{const active=b.dataset.name===name;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',active?'true':'false')});custom.classList.toggle('selected',name==='Custom');render();status.textContent=name+' gradient selected.'}
 function position(e){const r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
 $('linePicker').addEventListener('click',e=>{const b=e.target.closest('button[data-line]');if(!b)return;selectedEdge=Number(b.dataset.line);render();status.textContent=`Line ${selectedEdge+1} selected. Drag anywhere on the canvas to move it.`});
 stage.addEventListener('pointerdown',e=>{const p=position(e),hit=e.target?.dataset?.edge;if(hit!==undefined)selectedEdge=Number(hit);const ed=edges[selectedEdge],lineX=ed.top+(ed.bottom-ed.top)*p.y,nearLine=Math.abs(p.x-lineX)<.12;const mode=nearLine&&p.y<.22?'top':nearLine&&p.y>.78?'bottom':'both';drag={index:selectedEdge,startX:p.x,startTop:ed.top,startBottom:ed.bottom,mode};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');render();status.textContent=mode==='both'?`Moving Line ${selectedEdge+1}. It can cross the other line.`:'Drag sideways to change the line angle.'});
 stage.addEventListener('pointermove',e=>{if(!drag)return;const p=position(e),dx=p.x-drag.startX,ed=edges[drag.index];if(drag.mode!=='bottom')ed.top=clamp(drag.startTop+dx,-.35,1.35);if(drag.mode!=='top')ed.bottom=clamp(drag.startBottom+dx,-.35,1.35);render()});
 const stopDrag=()=>{drag=null;stage.classList.remove('dragging')};stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);
 $('depth').addEventListener('input',e=>{depth=Number(e.target.value)/100;$('depthValue').textContent=e.target.value+'%';render();status.textContent='Depth adjusted.'});
 $('stylePicker').addEventListener('click',e=>{const b=e.target.closest('button[data-style]');if(!b)return;depthStyle=b.dataset.style;render();status.textContent=b.textContent+' depth selected.'});
 $('regenerate').addEventListener('click',()=>{seed++;const r=n=>{const z=Math.sin((seed+n)*91.713)*43758.545;return z-Math.floor(z)};const shapes={prism:[{top:.08+r(1)*.34,bottom:.5+r(2)*.38},{top:.55+r(3)*.35,bottom:.05+r(4)*.4}],fold:[{top:-.08+r(1)*.72,bottom:.22+r(2)*.76},{top:.48+r(3)*.48,bottom:.05+r(4)*.82}],fan:[{top:.05+r(1)*.3,bottom:.5+r(2)*.5},{top:.12+r(3)*.38,bottom:.02+r(4)*.42}],slice:[{top:-.05+r(1)*.75,bottom:.02+r(2)*.62},{top:.4+r(3)*.7,bottom:.5+r(4)*.65}]};edges=shapes[depthStyle];selectedEdge=0;render();status.textContent='New dimensional '+depthStyle+' generated.'});
 $('reset').addEventListener('click',()=>{edges=depthStyle==='prism'?[{top:.24,bottom:.68},{top:.72,bottom:.18}]:[{top:.25,bottom:.67},{top:.78,bottom:1.1}];render();status.textContent='Edges reset.'});
 function save(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
 $('download').addEventListener('click',async()=>{const size=$('size').value,format=$('format').value,[w,h]=sizes[size],svg=svgString(w,h),base=`sharped-${size}-${w}x${h}`;try{if(format==='svg'){save(new Blob([svg],{type:'image/svg+xml'}),base+'.svg');status.textContent='SVG downloaded.';return}const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const context=c.getContext('2d');context.drawImage(img,0,0);URL.revokeObjectURL(url);const mime=format==='jpeg'?'image/jpeg':format==='webp'?'image/webp':'image/png';c.toBlob(blob=>{if(!blob){status.textContent='Export failed. Try PNG or SVG.';return}save(blob,base+'.'+(format==='jpeg'?'jpg':format));status.textContent=`${format.toUpperCase()} downloaded at ${w} × ${h}.`},mime,.94)};img.onerror=()=>{URL.revokeObjectURL(url);status.textContent='Export failed. Try SVG.'};img.src=url}catch{status.textContent='Export failed. Try another format.'}});
 render();
})();
</script>
</body>
</html>
